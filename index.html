<aside class="sidebar"><div class="brand"><span class="logo">協</span><div>協作中樞<small>GOVERNMENT WORKSPACE</small></div></div><div class="workspace">跨部門協調辦公室 <span>⌄</span></div><div class="navlabel">工作空間</div><nav><button class="active" data-view="overview">▦ <span>協作總覽</span></button><button data-view="chat">◉ <span>主題聊天室</span><b>3</b></button><button data-view="projects">▤ <span>專案進度</span></button><button data-view="issues">◇ <span>共同問題</span><b id="issuecount">2</b></button><button data-view="ai">✧ <span>AI 協調助理</span></button></nav><div class="sidebottom"><div class="demo">互動原型・示範資料</div><div class="person"><span class="avatar">林</span><div>林協調員<small>專案協調辦公室</small></div></div></div></aside>
<div class="shell"><header><div>工作空間 <span>/</span> <b id="crumb">協作總覽</b></div><span class="topdate">2026 年 9 月 19 日 <i></i> 示範工作區</span></header><main><div class="heading"><div><div class="eyebrow">跨部門協作 / COORDINATION</div><h1 id="pagetitle">讓協調，向前一步。</h1><p id="subtitle">掌握專案脈動，及早處理部門之間的共同問題。</p></div><button class="primary" id="topaction">開啟主題討論 <span>↗</span></button></div><div id="content"></div><footer>協作中樞 <span>初始案件與 AI 建議為示範；自行上傳的附件保存在本機服務，不會傳送至政府機關。</span></footer></main></div><div id="toast" role="status"></div><script>const projects=[{name:'都市防汛整備計畫',lead:'水利局',deps:'工務局・民政局',due:'09/30',tasks:[['易淹水區域盤點','水利局',true],['排水設施巡檢','工務局',true],['避難動線確認','民政局',false],['跨局處演練','水利局',false]]},{name:'長照服務資源整合',lead:'社會局',deps:'衛生局・資訊處',due:'10/08',tasks:[['服務據點清冊','社會局',true],['轉介欄位對照','衛生局',false],['平台介接確認','資訊處',false]]},{name:'校園周邊通學安全',lead:'交通局',deps:'教育局・工務局',due:'10/15',tasks:[['重點路口調查','交通局',true],['學校需求彙整','教育局',true],['工程方案定案','工務局',true],['改善成果確認','交通局',false]]}];
const rooms=['防汛整備協調','長照資源整合','通學安全改善'];const chats=[[{who:'陳專員',dept:'水利局',text:'已完成易淹水區域盤點。排水設施巡檢結果已更新，請民政局協助確認避難動線。',time:'09:10'},{who:'王承辦',dept:'民政局',text:'避難動線需要對照最新道路施工範圍，請工務局提供路段清冊，避免規劃衝突。',time:'09:25'}],[{who:'李科員',dept:'社會局',text:'服務據點清冊已完成；兩局使用的轉介欄位不同，需先確認共同定義。',time:'08:45'},{who:'周專員',dept:'衛生局',text:'建議共同建立欄位對照表，並確認必要資料範圍。',time:'09:05'}],[{who:'張專員',dept:'教育局',text:'學校需求彙整已完成，請交通局確認改善工程的成果驗收時程。',time:'昨天'}]];
const issues=[{title:'道路施工與避難動線可能重疊',level:'高優先',projects:[0,2],body:'防汛整備與通學改善都涉及道路施工範圍，需共同確認施工期間的替代動線。',evidence:'防汛聊天室 09:25 的道路清冊需求；通學專案的工程方案任務。',action:'召開動線協調會議',owner:'工務局',handled:false},{title:'跨局處轉介資料欄位不一致',level:'待協調',projects:[1],body:'社會局與衛生局對轉介欄位的定義尚未一致，可能影響平台介接。',evidence:'長照聊天室 08:45 與 09:05 的欄位定義討論。',action:'建立共同欄位對照表',owner:'社會局',handled:false}];let view='overview',room=0,selectedIssue=0;const titles={overview:['讓協調，向前一步。','掌握專案脈動，及早處理部門之間的共同問題。'],chat:['主題聊天室','讓需求、回應與協調脈絡，留在同一個主題裡。'],projects:['專案進度','追蹤各部門交付事項，確認下一步的負責單位。'],issues:['共同問題','從跨部門討論與任務相依關係，找出需要一起處理的問題。'],ai:['AI 協調助理','對照討論脈絡，檢視可採取的協調方案與待確認事項。']};
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t[2]).length/p.tasks.length*100):0;const toast=s=>{const e=document.querySelector('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3200)};function go(v){view=v;render();window.scrollTo(0,0)}function projectCard(p,i,full=false){return `<div class="project"><div class="projecttop"><div><h3>${escape(p.name)}</h3><div class="meta">${escape(p.lead)} 主責 · ${escape(p.deps)}</div></div><span class="tag ${i===1?'warn':''}">${pct(p)===100?'已完成':i===1?'待協調':'進行中'}</span></div><div class="progressline"><div class="bar"><div style="width:${pct(p)}%"></div></div><b>${pct(p)}%</b></div><div class="projectfoot"><span>${p.tasks.filter(t=>t[2]).length} / ${p.tasks.length} 項任務完成</span><span>目標完成 ${escape(p.due)}</span></div>${full?p.tasks.map((t,j)=>`<label class="task"><input type="checkbox" data-task="${i},${j}" ${t[2]?'checked':''}><span>${t[0]}</span><small>${t[1]}</small></label>`).join(''):''}</div>`}
function issueCard(q,i){return `<div class="issue"><div class="issuehead"><span class="tag ${q.handled?'':'warn'}">${q.handled?'已建立協調任務':q.level}</span><span class="meta">${q.projects.length} 個關聯專案</span></div><h3>${q.title}</h3><p>${q.body}</p><div class="meta">${q.projects.map(j=>escape(projects[j].name)).join(' / ')}</div><button class="textbtn" data-ai="${i}">檢視依據與建議 →</button></div>`}
function overview(){const total=projects.reduce((a,p)=>a+p.tasks.length,0),done=projects.reduce((a,p)=>a+p.tasks.filter(t=>t[2]).length,0);return `<div class="metrics"><div class="metric"><div class="label">協作專案</div><strong>${projects.length}<span>個</span></strong><small>依專案追蹤主責單位與任務</small></div><div class="metric"><div class="label">任務完成率</div><strong>${total?Math.round(done/total*100):0}<span>%</span></strong><small>已完成 ${done} / ${total} 項任務</small></div><div class="metric alert"><div class="label">待處理共同問題</div><strong>${issues.filter(q=>!q.handled).length}<span>項</span></strong><small>1 項涉及跨專案協調</small></div><div class="metric"><div class="label">主題討論</div><strong>3<span>個</span></strong><small>共 ${chats.flat().length} 則討論訊息</small></div></div><div class="grid"><div><section class="card"><div class="cardhead"><h2>專案進度</h2><button class="textbtn" data-go="projects">查看全部 ↗</button></div>${projects.map((p,i)=>projectCard(p,i)).join('')}</section><section class="card"><div class="cardhead"><h2>最新主題討論</h2><button class="textbtn" data-go="chat">進入聊天室 ↗</button></div>${rooms.map((r,i)=>{const m=chats[i].at(-1);return `<div class="thread" role="button" tabindex="0" data-room="${i}"><span class="hash">#</span><div><strong>${r}</strong><p>${escape(m.text)}</p><div class="meta">${m.who} · ${m.dept}</div></div><span class="time">${m.time}</span></div>`}).join('')}</section></div><div><section class="card"><div class="cardhead"><h2>共同問題提示</h2><span class="tag warn">需關注 ${issues.filter(q=>!q.handled).length}</span></div>${issues.map(issueCard).join('')}<div style="padding:0 24px 20px"><div class="signal">◇ 示範規則偵測 · 待協調員確認</div></div></section><section class="card aicard"><div class="cardhead"><h2>✧ AI 協調助理</h2><span class="ailabel">建議預覽</span></div><div class="aibody"><h3>讓共同問題有下一步</h3><p>彙整討論依據、提出協調步驟，並將採用的建議轉為待辦任務。</p><button class="primary" data-go="ai">檢視解決方案 →</button></div></section></div></div>`}
function chat(){return `<section class="card"><div class="chatlayout"><div class="rooms">${rooms.map((r,i)=>`<button data-room="${i}" class="${room===i?'selected':''}"># ${r}</button>`).join('')}</div><div class="chatmain"><div class="cardhead"><h2># ${rooms[room]}</h2><span class="tag neutral">${escape(projects[room].lead)} 主責</span></div><div class="messages">${chats[room].map(m=>`<div class="message"><span class="avatar">${escape(m.who[0])}</span><div><div class="meta"><b>${m.who}</b> · ${m.dept} · ${m.time}</div><div class="bubble">${escape(m.text)}</div></div></div>`).join('')}</div><form class="composer" id="chatForm"><input aria-label="討論訊息" id="message" placeholder="提出需求或分享進度…" required maxlength="2000"><button class="primary" type="submit">送出</button></form></div></div></section><div class="notice">示範聊天室：訊息僅保留於本次頁面操作，尚未連接多人即時服務。</div>`}
function ai(){const q=issues[selectedIssue];return `<div class="notice">AI 功能展示：以下為預先編寫的示範建議，尚未串接 AI 模型或外部資料檢索。採用前請由承辦人核實。</div><div class="aioptions"><label for="topic">協調主題</label><select id="topic">${issues.map((q,i)=>`<option value="${i}" ${selectedIssue===i?'selected':''}>${q.title}</option>`).join('')}</select></div><div class="grid"><section class="card"><div class="cardhead"><h2>✧ 解決方案建議</h2><span class="tag neutral">示範分析</span></div><div class="details"><h3>${q.title}</h3><p>${q.body}</p><div class="source"><b>建議一｜${q.action}</b><p>${selectedIssue===0?'由工務局彙整施工清冊，水利局標註易淹水區，民政局確認避難路線，交通局提供通學改善範圍，共同檢查衝突。':'由社會局與衛生局共同整理欄位名稱、定義、格式及必要性，交由資訊處確認介接方式。'}</p></div><div class="source"><b>建議二｜先辦理小範圍驗證</b><p>${selectedIssue===0?'選擇一個重疊路段走查，確認替代動線與現場標示，再擴大到其他區域。':'以虛構測試資料驗證欄位對應，記錄無法轉換的項目，確認後再擴大驗證範圍。'}</p></div><h3>執行步驟</h3><ol><li>${q.owner} 彙整各單位需提供的資料。</li><li>安排跨局處確認會議，確定負責人與交付日期。</li><li>確認方案後更新專案任務，於下次會議追蹤。</li></ol><button class="primary" id="adopt" ${q.handled?'disabled':''}>${q.handled?'已加入專案待辦':'採用建議，建立協調任務'}</button></div></section><div><section class="card"><div class="cardhead"><h2>資料依據</h2></div><div class="details"><div class="ailabel">平台內示範資料</div><p>${q.evidence}</p><button class="textbtn" data-room="${q.projects[0]}" style="margin-top:16px">查看原始討論 →</button></div></section><section class="card"><div class="cardhead"><h2>仍需確認</h2></div><div class="details"><ul><li>${selectedIssue===0?'道路施工清冊是否為最新版本？':'哪些欄位是完成轉介所必需？'}</li><li>各單位是否同意主責與分工？</li><li>是否有尚未列入的限制或相依任務？</li></ul><p style="font-size:14px">本原型未引用外部政策文件，也未進行法規適用判斷。</p></div></section></div></div>`}
function render(){document.querySelector('#pagetitle').textContent=titles[view][0];document.querySelector('#subtitle').textContent=titles[view][1];document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)document.querySelector('#crumb').textContent=b.querySelector('span').textContent});document.querySelector('#issuecount').textContent=issues.filter(q=>!q.handled).length;document.querySelector('#content').innerHTML=view==='overview'?overview():view==='chat'?chat():view==='projects'?`<div class="notice">勾選已完成任務，進度會同步更新。此處的變更僅用於本次原型操作。</div>${projects.map((p,i)=>`<section class="card">${projectCard(p,i,true)}</section>`).join('')}`:view==='issues'?`<div class="notice">目前依示範討論與任務關聯呈現 2 項提示；正式版可在新增訊息或任務變更時自動偵測。</div><section class="card">${issues.map(issueCard).join('')}</section>`:ai();bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-room]').forEach(b=>{b.onclick=()=>{room=+b.dataset.room;go('chat')};b.onkeydown=e=>{if(e.key==='Enter')b.click()}});document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{selectedIssue=+b.dataset.ai;go('ai')});document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{const[i,j]=b.dataset.task.split(',').map(Number);projects[i].tasks[j][2]=b.checked;render()});const form=document.querySelector('#chatForm');if(form)form.onsubmit=e=>{e.preventDefault();const input=document.querySelector('#message'),s=input.value.trim();if(!s)return;chats[room].push({who:'林協調員',dept:'專案協調辦公室',text:s,time:'剛剛'});render();document.querySelector('.messages').scrollTop=100000;document.querySelector('#message').focus()};const topic=document.querySelector('#topic');if(topic)topic.onchange=()=>{selectedIssue=+topic.value;render()};const adopt=document.querySelector('#adopt');if(adopt)adopt.onclick=()=>{const q=issues[selectedIssue];if(q.handled)return;q.handled=true;projects[q.projects[0]].tasks.push([q.action,q.owner,false]);render();toast('已加入專案待辦，可到「專案進度」追蹤。')}}
projects.forEach(p=>{p.due='2026-'+p.due.replace('/','-');p.tasks.forEach(t=>t[3]=p.due)});
const baseProjectCard=projectCard;
projectCard=function(p,i,full=false){
 let html=baseProjectCard(p,i,false);
 if(!full)return html;
 const rows=p.tasks.map((t,j)=>`<div class="task"><input type="checkbox" aria-label="完成：${escape(t[0])}" data-task="${i},${j}" ${t[2]?'checked':''}><span>${escape(t[0])}<small>主責：${escape(t[1])} · 期限：${escape(t[3]||'未設定')}</small></span><button class="textbtn" data-edit-task="${i},${j}" aria-label="編輯任務：${escape(t[0])}">編輯</button></div>`).join('');
 const toolbar=`<div class="editbar"><button class="textbtn" data-edit-project="${i}">編輯專案</button><button class="primary" data-add-task="${i}">＋ 新增任務</button></div>`;
 return html.slice(0,-6)+toolbar+(rows||'<p class="emptytasks">尚未建立任務，請先新增第一項工作。</p>')+'</div>';
};
const baseRender=render;
render=function(){baseRender();const action=document.querySelector('#topaction');action.textContent=view==='projects'?'＋ 新增專案':'開啟主題討論 ↗';action.onclick=()=>view==='projects'?openEditor('project'):go('chat');if(view==='projects')document.querySelector('.notice').textContent='新增專案或編輯任務，指定主責單位與期限。變更僅保留於本次開啟的頁面，重新整理即重置。';};
const baseBind=bind;
bind=function(){baseBind();document.querySelectorAll('[data-edit-project]').forEach(b=>b.onclick=()=>openEditor('project',+b.dataset.editProject));document.querySelectorAll('[data-add-task]').forEach(b=>b.onclick=()=>openEditor('task',+b.dataset.addTask));document.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.editTask.split(',').map(Number);openEditor('task',i,j)});};
function openEditor(kind,pi=null,ti=null){
 const isProject=kind==='project',existing=isProject?pi!==null:ti!==null;
 const p=pi!==null?projects[pi]:null,t=existing&&!isProject?p.tasks[ti]:null;
 const dlg=document.createElement('dialog');dlg.className='editor';dlg.setAttribute('aria-labelledby','editor-title');
 const field=(label,name,value,type='text',required=true)=>`<label class="field">${label}<input name="${name}" type="${type}" value="${escape(value||'')}" ${required?'required':''} ${type==='text'?'maxlength="120"':''}></label>`;
 dlg.innerHTML=`<form><h2 id="editor-title">${existing?'編輯':'新增'}${isProject?'專案':'任務'}</h2><p class="editorhint">${isProject?'設定專案的工作範圍與主責單位。':'任務完成狀態會同步計入專案進度。'}</p>${field(isProject?'專案名稱':'任務名稱','name',isProject?p?.name:t?.[0])}${field('主責單位','lead',isProject?p?.lead:(t?.[1]||p.lead))}${isProject?field('參與單位（選填）','deps',p?.deps,'text',false):''}${field('完成期限','due',isProject?p?.due:(t?.[3]||p.due),'date')}${!isProject?`<label class="task"><input type="checkbox" name="done" ${t?.[2]?'checked':''}>已完成</label>`:''}<p class="formerror" role="alert"></p><div class="editoractions"><button type="button" class="textbtn" id="cancelEdit">取消</button><button type="submit" class="primary">儲存${isProject?'專案':'任務'}</button></div></form>`;
 document.body.append(dlg);const opener=document.activeElement;dlg.addEventListener('close',()=>{dlg.remove();if(opener?.isConnected)opener.focus()});dlg.querySelector('#cancelEdit').onclick=()=>dlg.close();
 dlg.querySelector('form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.currentTarget),name=String(data.get('name')).trim(),lead=String(data.get('lead')).trim(),due=String(data.get('due'));if(!name||!lead){dlg.querySelector('.formerror').textContent='名稱與主責單位不能只有空白。';return;}if(!/^\d{4}-\d{2}-\d{2}$/.test(due)){dlg.querySelector('.formerror').textContent='請填寫有效的完成日期。';return;}
 if(isProject){const fields={name,lead,due,deps:String(data.get('deps')||'').trim()};if(existing)Object.assign(p,fields);else projects.push({...fields,tasks:[]});}else{const task=[name,lead,data.has('done'),due];if(existing)p.tasks[ti]=task;else p.tasks.push(task);}
 dlg.close();render();toast('已更新本次頁面的'+(isProject?'專案':'任務')+'。');};
 dlg.showModal();
}

</script><script>// Local attachment service; no model calls or API credentials are placed in the browser.
let attachmentReady=false,lastSaved='',saving=Promise.resolve();
const attachmentMode=location.origin==='http://127.0.0.1:4174';
const attachmentRender=render;
function snapshot(){return JSON.stringify({projects,handled:issues.map(x=>x.handled)})}
function persistProjects(){
 if(!attachmentReady)return Promise.reject(new Error('附件服務尚未就緒'));
 projects.forEach((p,i)=>{if(!p.id)p.id=crypto.randomUUID()});
 const current=snapshot();
 saving=saving.catch(()=>{}).then(async()=>{if(current===lastSaved)return;const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:current});if(!r.ok)throw new Error('專案未能保存，請保持頁面開啟並重試。');lastSaved=current;});return saving;
}
render=function(){attachmentRender();if(view==='projects'){
 document.querySelector('.notice').textContent=attachmentMode?'專案與附件保存在這台電腦。附件不會自動送往 AI，也不會公開上網。':'新增與編輯只保留於本次頁面。附件功能請開啟本機服務版。';
 document.querySelectorAll('.editbar').forEach((bar,i)=>{const b=document.createElement('button');b.className='textbtn';b.textContent='參考文件 / 上傳';b.onclick=()=>showDocuments(i);bar.prepend(b)});
 }if(attachmentReady)persistProjects().catch(e=>toast(e.message));};
async function showDocuments(i){
 const p=projects[i],dlg=document.createElement('dialog');dlg.className='editor documenteditor';dlg.setAttribute('aria-label','專案參考文件');
 dlg.innerHTML=`<h2>${escape(p.name)}｜參考文件</h2><p class="editorhint">每份最多 10 MB。可保存 PDF、DOCX、XLSX、TXT、MD、CSV；可擷取文字型 PDF、DOCX、XLSX 及 UTF-8 文字檔；不含掃描影像辨識。</p><div class="notice">按「AI 分析／建議」會將這份附件的擷取文字送到 OpenAI 分析，使用 API 額度。每份最多 50,000 字；建議需由承辦人核實。已有分析時會顯示已保存結果。</div><label class="field">選擇附件<input type="file" accept=".pdf,.docx,.xlsx,.txt,.md,.csv" id="uploadDoc"></label><p id="docStatus" role="status"></p><div id="docList"></div><div class="editoractions"><button class="textbtn" id="closeDocs">關閉</button></div>`;
 document.body.append(dlg);dlg.addEventListener('close',()=>dlg.remove());dlg.querySelector('#closeDocs').onclick=()=>dlg.close();dlg.showModal();const status=dlg.querySelector('#docStatus'),list=dlg.querySelector('#docList'),input=dlg.querySelector('#uploadDoc');
 if(!attachmentMode){input.disabled=true;status.innerHTML='附件需要本機服務，請開啟 <a href="http://127.0.0.1:4174/">可上傳文件的版本</a>。';return;}
 const reload=async()=>{const r=await fetch('/api/documents?project='+encodeURIComponent(p.id));if(!r.ok)throw new Error('無法取得附件清單');const data=await r.json();list.innerHTML=data.documents.map(d=>`<div class="source"><h3>${escape(d.name)}</h3><p>${Math.ceil(d.size/1024)} KB · ${escape(d.created)} UTC</p><p>${escape(d.status)}</p><button class="textbtn" data-analyze-doc="${d.id}">AI 分析／建議</button> · <button class="textbtn" data-read-doc="${d.id}">預覽原文</button> · <a href="/api/documents/${d.id}?download=1">下載附件</a></div>`).join('')||'<p class="emptytasks">尚無附件。上傳後可查看原文擷取結果。</p>';list.querySelectorAll('[data-analyze-doc]').forEach(b=>b.onclick=()=>analyzeDocument(p,b.dataset.analyzeDoc,b,status));list.querySelectorAll('[data-read-doc]').forEach(b=>b.onclick=async()=>{try{const response=await fetch('/api/documents/'+b.dataset.readDoc);if(!response.ok)throw Error();const doc=await response.json(),preview=document.createElement('dialog');preview.className='editor documenteditor';preview.innerHTML='<h2></h2><p></p><pre class="documenttext"></pre><button class="primary">關閉</button>';preview.querySelector('h2').textContent=doc.name;preview.querySelector('p').textContent=doc.status;preview.querySelector('pre').textContent=doc.text||'沒有可預覽文字。可下載原始附件查閱。';preview.querySelector('button').onclick=()=>preview.close();preview.onclose=()=>preview.remove();document.body.append(preview);preview.showModal()}catch{status.textContent='原文讀取失敗，請稍後重試。'}});};
 try{await persistProjects();await reload()}catch(e){status.textContent=e.message}
 input.onchange=async()=>{const file=input.files[0];if(!file)return;if(file.size===0||file.size>10*1024*1024){status.textContent='請選擇非空白且不超過 10 MB 的附件。';input.value='';return;}input.disabled=true;status.textContent='正在保存並讀取文件…';try{await persistProjects();const r=await fetch('/api/documents?project='+encodeURIComponent(p.id)+'&name='+encodeURIComponent(file.name),{method:'POST',body:file});const data=await r.json();if(!r.ok)throw new Error(data.error||'上傳失敗');status.textContent=data.status;await reload()}catch(e){status.textContent=e.message||'上傳失敗，請重試'}finally{input.disabled=false;input.value=''}};
}
async function startAttachments(){
 if(!attachmentMode){render();return;}
 document.querySelector('#content').inert=true;
 try{const r=await fetch('/api/state');if(!r.ok)throw Error();const data=await r.json();if(data.state){projects.splice(0,projects.length,...data.state.projects);issues.forEach((q,i)=>q.handled=!!data.state.handled?.[i]);}projects.forEach((p,i)=>{if(!p.id)p.id='initial-'+i});attachmentReady=true;render();}
 catch{toast('無法載入已保存專案；附件功能暫不可用，請重新開啟本機服務。')}
 finally{document.querySelector('#content').inert=false;}
}
startAttachments();
async function analyzeDocument(project,id,button,status){
 button.disabled=true;status.textContent='正在讀取分析結果…';
 try{
  const saved=await fetch('/api/analysis?document='+encodeURIComponent(id));if(!saved.ok)throw Error('無法讀取已保存的分析');let data=await saved.json();
  if(!data.analysis){status.textContent='AI 正在閱讀文件並整理建議，請稍候…';const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:project.id,document:id})});data=await response.json();if(!response.ok)throw Error(data.error||'分析失敗');}
  status.textContent='分析已保存於本機，可再次開啟查看。';showAnalysis(project,data.analysis);
 }catch(e){status.textContent=e.message||'無法完成分析，請重試。';}finally{button.disabled=false;}
}
function showAnalysis(project,result){
 const modal=document.createElement('dialog');modal.className='editor documenteditor';modal.setAttribute('aria-label','AI 文件分析');
 modal.innerHTML=`<h2>AI 文件分析與協調建議</h2><p class="editorhint">根據附件原文分析 · ${escape(result.model)} · 請核實後採用</p><h3>文件摘要</h3><p>${escape(result.summary)}</p>${result.recommendations.map((r,i)=>`<section class="source"><h3>${escape(r.title)}</h3><p>${escape(r.action)}</p><p>主責：${escape(r.owner)} · 期限：${escape(r.deadline||'待確認')}</p><blockquote><b>${escape(r.location)}</b><br>${escape(r.quote)}</blockquote><button class="textbtn" data-use-advice="${i}">確認內容並建立任務 →</button></section>`).join('')||'<p class="emptytasks">沒有足夠依據提出可引用的任務建議。</p>'}<h3>待確認事項</h3><ul>${result.questions.map(q=>`<li>${escape(q)}</li>`).join('')}</ul><div class="editoractions"><button class="primary" id="closeAnalysis">關閉</button></div>`;
 document.body.append(modal);modal.onclose=()=>modal.remove();modal.querySelector('#closeAnalysis').onclick=()=>modal.close();modal.querySelectorAll('[data-use-advice]').forEach(b=>b.onclick=()=>{const rec=result.recommendations[+b.dataset.useAdvice],i=projects.findIndex(p=>p.id===project.id);if(i<0)return;openEditor('task',i);const form=[...document.querySelectorAll('dialog form')].at(-1);form.elements.name.value=rec.title;form.elements.lead.value=rec.owner==='待確認'?'':rec.owner;form.elements.due.value=rec.deadline||'';});modal.showModal();
}
